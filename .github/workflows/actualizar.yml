# Lee ODK, arma la pagina y la publica en GitHub Pages.
# Cada 10 minutos de 06:00 a 22:00 hora de Ecuador (UTC-5), y a mano desde la
# pestaña Actions (Run workflow). GitHub puede atrasar un poco los horarios.
name: Actualizar seguimiento

on:
  schedule:
    - cron: "*/10 11-23 * * *"
    - cron: "*/10 0-2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Sin el usuario de ODK cargado no hay nada que hacer: se salta todo en
    # vez de fallar (y mandar un correo de error cada 10 minutos).
    env:
      HAY_ODK: ${{ secrets.ODK_EMAIL != '' && secrets.ODK_PASSWORD != '' }}
    steps:
      - name: Falta el usuario de ODK
        if: env.HAY_ODK != 'true'
        run: echo "::warning::Cargar los secretos ODK_EMAIL y ODK_PASSWORD para que se actualice"
      - uses: actions/checkout@v4
        if: env.HAY_ODK == 'true'
      - uses: actions/setup-python@v5
        if: env.HAY_ODK == 'true'
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: env.HAY_ODK == 'true'
      - name: Armar la pagina
        if: env.HAY_ODK == 'true'
        env:
          ODK_URL: ${{ secrets.ODK_URL }}
          ODK_EMAIL: ${{ secrets.ODK_EMAIL }}
          ODK_PASSWORD: ${{ secrets.ODK_PASSWORD }}
          SEGUIMIENTO_CLAVE: ${{ secrets.SEGUIMIENTO_CLAVE }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        if: env.HAY_ODK == 'true'
        with:
          path: sitio
      - id: deploy
        if: env.HAY_ODK == 'true'
        uses: actions/deploy-pages@v4
